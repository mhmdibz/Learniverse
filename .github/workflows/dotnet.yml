name: Learniverse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Learniverse.slnx

      - name: Build
        run: dotnet build Learniverse.slnx --no-restore

      - name: Test
        run: dotnet test Learniverse.slnx --no-build

